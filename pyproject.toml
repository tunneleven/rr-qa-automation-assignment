[project]
name = "rr-qa-automation-assignment"
version = "0.1.0"
description = "UI and browser API test automation for TMDB Discover"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
test = [
    "pytest>=8.3,<9",
    "pytest-base-url>=2.1,<3",
    "pytest-html>=4.1,<5",
    "pytest-playwright>=0.7,<1",
]
dev = [
    { include-group = "test" },
    "pre-commit>=4.6,<5",
    "ruff>=0.16,<1",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--browser=chromium",
    # Keep headless and headed runs on the same full Chromium network stack.
    "--browser-channel=chromium",
    "--tracing=retain-on-failure",
    "--screenshot=only-on-failure",
    "--full-page-screenshot",
    "--html=artifacts/report.html",
    "--self-contained-html",
]
base_url = "https://tmdb-discover.surge.sh"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
log_cli_date_format = "%H:%M:%S"
markers = [
    "smoke: critical-path checks",
    "regression: broader functional coverage",
    "ui: browser user-interface checks",
    "api: browser network request/response checks",
    "negative: invalid-input and known-defect checks",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".pi"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PT", "RUF", "T20"]
